spring.application.name=booking

# Server Port
server.port=8080

# H2 Database Configuration (In-Memory)
spring.datasource.url=jdbc:h2:mem:bookingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
# Credentials are read from environment variables so nothing sensitive is committed.
# The fallback values are for local/dev convenience only (matches the in-memory H2
# instance) and must be overridden via env vars for any shared/production environment.
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configurations
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
# Secret is read from the JWT_SECRET environment variable so it is never committed to
# version control. The fallback value here is ONLY for local/dev convenience and must
# be overridden (via env var, or an untracked application-local.properties) for anything
# beyond a laptop demo.
jwt.secret=${JWT_SECRET:dev-only-9a2f8c4e7b1d3f6a8c0e2b4d6f8a1c3e5b7d9f2a4c6e8b0d2f4a6c8e0b2d4f6a}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}